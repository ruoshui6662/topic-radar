  #   environment: { TZ: Asia/Shanghai }

  # ② wewe-rss（公众号内容流，M1 spike / M2 正式接入）
  # 需要 mongo + redis 两个依赖，见 deploy/wewe-rss.md 独立部署说明

  # ③ tophub 热榜容器（覆盖微博/知乎/抖音等直连被拦的源）
